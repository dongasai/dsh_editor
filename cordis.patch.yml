# 工作区文件编辑器（@local/dsh-plugin-workspace-editor）
#
# 一个 bundle 两半：
#   - Host 半边（index.js）注册唯一一条写文件路由 POST /workspace-editor/write；
#   - 浏览器半边（client.js，由 package.json 的 dsh.client 声明）往右侧栏文档预览里
#     注册可编辑的渲染器。
#
# 只插入一行插件；浏览器半边由 dsh-client-modules 扫描同一行的 dsh.client 得到，
# 不在这里重复注册。
- insert:
    - id: workspace-editor
      name: '@local/dsh-plugin-workspace-editor'
