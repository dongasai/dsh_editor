# 工作区文件编辑器（@dongasai/dsh-editor）
#
# 一个 bundle 两半：
#   - Host 半边（index.js）按 ENDPOINTS 表注册六条变更路由：POST /workspace-editor/
#     {write,delete,mkdir,rename,copy,upload}；
#   - 浏览器半边（client.js，由 package.json 的 dsh.client 声明）往右侧栏注册可编辑的
#     文档渲染器、编辑器 / 图片 / 「文件编辑」三个页签类型与预览头部的「编辑」「删除」按钮。
#
# 只插入一行插件；浏览器半边由 dsh-client-modules 扫描同一行的 dsh.client 得到，
# 不在这里重复注册。
- insert:
    - id: workspace-editor
      name: '@dongasai/dsh-editor'
